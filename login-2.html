<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<style>
    body{
        background-image: url(images/d4c9cb4107cad8d6adea631072c4f2fbcc149ce1.jpg);
    }
</style>
<body class="min-h-screen flex justify-center items-center px-4 py-6">

    <div class="w-full max-w-[500px] min-h-[60vh] mx-auto bg-white rounded-[20px] flex flex-col items-center justify-center px-5 sm:px-8 py-8 sm:py-10">

        <!--logo -->
        <img 
            src="images/Logo.svg" 
            class="w-[30px] mb-2" 
            alt="Logo"
        >

        <!-- heading -->
        <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-3">
            Register to get free access to all our resources
        </h1>

        <!-- suitable -->
        <p class="text-gray-500 text-center text-sm sm:text-base mb-6 sm:mb-8">
            Sign up to see more
        </p>


        <form action="" class="w-full flex flex-col items-center gap-4">

            <!-- email -->
            <button 
                type="button"
                class="w-full max-w-[350px] h-[46px] sm:h-[48px] rounded-full border border-gray-300 text-white bg-black font-medium text-sm sm:text-base"
            >
                Continue with Email
            </button>


            <!-- facebook -->
            <button 
                type="button"
                class="w-full max-w-[350px] h-[46px] sm:h-[48px] rounded-full border border-gray-300 text-black font-medium text-sm sm:text-base flex items-center justify-center gap-3"
            >

                <img 
                    class="bg-blue-600 p-1 rounded-full w-[20px] h-[20px]"
                    src="icons/facebook.svg" 
                    alt="Facebook"
                >

                Continue with Facebook

            </button>


            <!-- google -->
            <button 
                type="button"
                class="w-full max-w-[350px] h-[46px] sm:h-[48px] rounded-full border border-gray-300 bg-white text-gray-700 font-medium text-sm sm:text-base flex items-center justify-center gap-3"
            >

                <img 
                    class="w-[20px] h-[20px]"
                    src="icons/google.svg" 
                    alt="Google"
                >

                Continue with Google

            </button>


            <!-- terms -->
            <div class="mt-4 sm:mt-6 text-center text-[11px] sm:text-[12px] text-gray-500 leading-5">

                <p>
                    By continuing, you agree to the
                    <span class="font-semibold text-black underline">
                        Terms of Service
                    </span>
                </p>

                <p>
                    and acknowledge you've read our
                    <span class="font-semibold text-gray-800 underline">
                        Privacy Policy
                    </span>
                </p>

                <p class="mt-4">
                    Already a member?
                    <span class="font-semibold underline text-black">
                        Log in
                    </span>
                </p>

            </div>

        </form>

    </div>

</body>
</body>
</html>
