<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page 05</title>

    <link rel="stylesheet" href="/css/page-5.css" />
  </head>
  <body>
    <div class="container">
      <div class="main">
        <div class="title-box">
          <h2>Welcome to Phnes Design Agency</h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea minus
            cum temporibus laborum ratione harum.
          </p>
        </div>

        <!-- /* ---- form -----*/ -->
        <form action="">
          <div>
            <label for="email">Email</label>
            <input type="email" name="email" />
          </div>

          <div>
            <label for="UserName">UserName</label>
            <input type="text" name="UserName" />
          </div>

          <div id="password-div">
            <img src="/images/page-5/see.svg" alt="" />
            <label for="password">Password</label>
            <input type="password" name="password" />
          </div>

          <!-- ----- password rules ----- -->
          <div class="password-rules">
            <img src="/images/page-5/Password Setup Instructions.png" alt="" />
          </div>

          <!-- ------- check ----- -->
          <div class="check">
            <label for="check">
              <img src="/images//page-5/check.svg" alt="" />
              I agree to the Terms of Service and acknowledge you’ve read our
              Privacy Policy.
            </label>
          </div>

          <button class="create-btn" type="submit">Create an account</button>

          <p class="login-text">Already a member? <a href="#">Log in</a></p>
        </form>
      </div>

      <!-- /* ------ BOX 02 IMAGE ----- */ -->
      <div class="box-right-image">
        <img src="/images/page-5/page-5-main-image.png" alt="" />
      </div>
    </div>
  </body>
</html>
