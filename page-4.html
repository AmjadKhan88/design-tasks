<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account</title>

    <link rel="stylesheet" href="/css/page-04.css" />
  </head>

  <body>
    <div class="signup-card">
      <div class="card-detail">
        <img src="/images/page-4/Cancel.svg" alt="" class="close-btn" />

        <!-- Logo -->
        <div class="logo">
          <img src="/images/page-4/Logo.png" alt="" />
        </div>

        <!-- Heading -->
        <h1>Create an account</h1>

        <!-- Login Text -->
        <p class="login-text">
          Already have an account?
          <a href="#">Login</a>
        </p>

        <!-- Social Buttons -->
        <div class="social-buttons">
          <button class="social-btn">
            <img src="/images/page-4/facebook.svg" alt="" />
            Continue with Facebook
          </button>

          <button class="social-btn">
            <img src="/images/page-4/google.png" alt="" />
            Continue with Google
          </button>
        </div>

        <!-- Divider -->
        <div class="or">
          <img src="/images/page-4/Divider.png" alt="" />
        </div>

        <!-- Email -->
        <div class="form">
          <label for="email">
            Enter your email address to create an account.
          </label>

          <label for="email"> Email :</label>

          <input type="email" id="email" placeholder="Your email" />
        </div>

        <!-- Submit -->
        <button class="create-btn">Create an account</button>
      </div>
    </div>
  </body>
</html>
