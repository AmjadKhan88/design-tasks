<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <link rel="stylesheet" href="css/login-1.css">
   <style>
    body{
        background-color: gray;
    }
   </style>
</head>
<body>
<div class="bg-[#17161d] min-h-screen w-full">

    <div class="max-w-[1200px] min-h-screen mx-auto flex items-center justify-center gap-3 p-5">
         <div class="w-[50%] mt-4 hidden md:block">

            <img 
                class="w-full h-[100vh] object-cover rounded-[20px]"
                src="images/Frame 1.svg" 
                alt="ExploreMe"
            >

        </div>

        <div class="w-full max-w-[500px] px-5 sm:px-[40px] md:px-[50px] lg:px-[70px] py-[40px] rounded-[5px] text-white">

            <div class="flex items-center gap-[10px]">
                <img 
                    src="images/Logo.svg" 
                    alt="ExploreMe logo" 
                    class="w-[30px]"
                >
                <span>Logo</span>
            </div>
            <div class="mt-[45px]">

                <h1 class="text-[24px] font-bold mb-[10px]">
                    Welcome to ExploreMe &#9995;
                </h1>

                <p class="text-[#92909d] text-[13px]">
                    Kindly fill your details below to create an account
                </p>

            </div>

            <form action="" class="mt-[38px]">
                <div class="mb-[16px]">

                    <label 
                        for="name" 
                        class="block text-[12px] mb-[7px] text-[#dddce4]"
                    >
                        Full Name
                    </label>

                    <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter your full name"
                        class="w-full h-[40px] box-border bg-transparent border border-[#555360] rounded-[5px] px-[14px] text-white outline-none placeholder:text-[#8f8d99] placeholder:text-[12px] focus:border-[#7654f6]"
                    >

                </div>
                <div class="mb-[16px]">

                    <label 
                        for="email"
                        class="block text-[12px] mb-[7px] text-[#dddce4]"
                    >
                        Email Address*
                    </label>

                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email address"
                        class="w-full h-[40px] box-border bg-transparent border border-[#555360] rounded-[5px] px-[14px] text-white outline-none placeholder:text-[#8f8d99] placeholder:text-[12px] focus:border-[#7654f6]"
                    >

                </div>
                <div class="mb-[16px]">

                    <label 
                        for="skill"
                        class="block text-[12px] mb-[7px] text-[#dddce4]"
                    >
                        Select your skills
                    </label>

                    <input 
                        type="search" 
                        id="skill"
                        placeholder="Search skills here..."
                        class="w-full h-[40px] box-border bg-transparent border border-[#555360] rounded-[5px] px-[14px] text-white outline-none placeholder:text-[#8f8d99] placeholder:text-[12px] focus:border-[#7654f6]"
                    >

                </div>
                <div class="flex items-center gap-[8px] mb-[20px]">

                    <input 
                        type="checkbox" 
                        name="agreement" 
                        id="agree"
                    >

                    <label 
                        for="agree" 
                        class="text-[12px] text-[#dddce4]"
                    >
                        I agree to terms & conditions
                    </label>

                </div>
                <div>

                    <button 
                        type="submit"
                        class="w-full h-[40px] border-0 rounded-[5px] bg-[#7654f6] text-white text-[12px] cursor-pointer hover:bg-[#6845e8]"
                    >
                        Register Account
                    </button>

                </div>

                <div class="flex items-center gap-[10px] my-[18px]">

                    <span class="flex-1 h-[1px] bg-[#44424c]"></span>

                    <p class="m-0 text-[#8f8d99] text-[12px]">
                        Or
                    </p>

                    <span class="flex-1 h-[1px] bg-[#44424c]"></span>

                </div>
                <div>

                    <button 
                        type="button"
                        class="w-full h-[40px] border-0 rounded-[5px] bg-[#0d0c11] text-white cursor-pointer flex items-center justify-center gap-[10px]"
                    >

                        <img 
                            src="images/flat-color-icons_google.svg" 
                            alt="Google"
                            class="w-[17px]"
                        >

                        Register with Google

                    </button>

                </div>
                <p class="mt-[18px] text-[#8f8d99] text-[12px] text-center">

                    Already have an account?

                    <a 
                        href="#" 
                        class="text-white underline"
                    >
                        Log in
                    </a>

                </p>

            </form>

        </div>
       

    </div>

</div>
</body>
</html>
