<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/css/page-6.css" />
  </head>

  <body>
    <div class="container">
      <!-- LEFT SIDE -->
      <div class="left-section">
        <div class="logo">
          <img src="/images/page-06/Brand Logo.svg" alt="" />
        </div>

        <div class="left-content">
          <h1>
            Connecting Talent<br />
            to Opportunities
          </h1>

          <p>
            Discover endless opportunities on<br />
            FreelanceConnect, where talented freelancers and<br />
            businesses unite. Jump right in with us!
          </p>
        </div>

        <div class="footer-frelance">
          <img src="/images/page-06/Frame 381.png" alt="" />
        </div>

        <div class="footer-dots">
          <img src="/images/page-06/footer-dots.svg" alt="" />
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-section">
        <div class="form-container">
          <h2>Create your account with us below</h2>

          <p class="login">
            Already have an account?
            <a href="#">Login</a>
          </p>

          <form>
            <!-- ROLE -->
            <label class="field-label"> You're creating an account as? </label>

            <div class="role-image">
              <img src="/images/page-06/role.png" alt="" />
            </div>

            <!-- NAME -->
            <div class="field">
              <label for="name">Full Name</label>
              <input type="text" id="name" placeholder="David Goldsmith" />
            </div>

            <!-- EMAIL -->
            <div class="field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email address"
              />
            </div>

            <!-- PASSWORD -->
            <div class="field">
              <label for="password">Password</label>

              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  placeholder="Create your password"
                />

                <img src="/images/page-06/eye-disable.svg" alt="" class="eye" />
              </div>
            </div>

            <!-- SKILLS -->
            <div class="field">
              <label>Select your Skills</label>

              <input type="text" placeholder="Search skills here..." />

              <div class="skills">
                <img src="/images/page-06/Skills.png" alt="" />
              </div>
            </div>

            <button type="submit">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
