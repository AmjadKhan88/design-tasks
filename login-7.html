<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create an Account</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-0 md:p-4">

    <!-- Main Container -->
    <div
        class="w-full max-w-6xl min-h-screen md:min-h-[700px] 
               bg-white md:rounded-3xl overflow-hidden 
               shadow-xl flex"
    >

        <!-- LEFT IMAGE SECTION -->
       <div 
    class="hidden md:flex w-1/2 relative 
           rounded-tl-3xl rounded-bl-3xl overflow-hidden
           bg-gradient-to-br from-purple-700 via-violet-600 to-indigo-500"
>

            <!-- Background Image -->
            <img
                src="./images/image.jpg"
                alt="Team working"
                class="absolute inset-0 w-full h-full object-cover"
            >

            

            
        </div>


        <!-- RIGHT SIGN UP SECTION -->
        <div
            class="-ml-[50px] z-10 w-full md:w-1/2 bg-white flex items-center justify-center
                   px-6 py-10  sm:px-12 md:px-10 lg:px-16 rounded-tl-[3rem] rounded-bl-[3rem]  "
        >

            <div class="w-full max-w-md ml-[30px]">

                <!-- Logo -->
                <div class="flex justify-center mb-4">

                    <div
                        class="w-9 h-9 rounded-full 
                               bg-gradient-to-br from-purple-500 to-indigo-600
                               flex items-center justify-center shadow-md"
                    >
                    <img src="./icons/Logo.svg" class="text-white text-sm " alt="img">
                    </div>

                </div>


                <!-- Heading -->
                <div class="text-center mb-5">

                    <h2 class="text-xl font-bold text-gray-900">
                        Create an account
                    </h2>

                </div>


                <!-- Google Button -->
                <button
                    type="button"
                    class="w-full h-10 border border-gray-200 rounded-md
                           flex items-center justify-center gap-2
                           text-xs text-gray-700
                           hover:bg-gray-50 transition"
                >
                    <span>Create account with Google</span>

                    <img src="./icons/flat-color-icons_google.svg" class="text-red-500 h-5" alt="">
                </button>


                <!-- OR -->
                <div class="flex items-center gap-3 my-4">

                    <div class="h-px bg-gray-200 flex-1"></div>

                    <span class="text-[10px] text-gray-400">
                        Or
                    </span>

                    <div class="h-px bg-gray-200 flex-1"></div>

                </div>


                <!-- FORM -->
                <form class="space-y-3 rounded-3xl">

                    <!-- Email -->
                    <div>

                        <label
                            for="email"
                            class="block text-[11px] text-gray-500 mb-1"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            class="w-full h-10 px-3 text-xs
                                   border border-gray-200 rounded-md
                                   outline-none
                                   focus:border-purple-500
                                   focus:ring-2 focus:ring-purple-100
                                   transition"
                        >

                    </div>


                    <!-- Full Name -->
                    <div>

                        <label
                            for="name"
                            class="block text-[11px] text-gray-500 mb-1"
                        >
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            class="w-full h-10 px-3 text-xs
                                   border border-gray-200 rounded-md
                                   outline-none
                                   focus:border-purple-500
                                   focus:ring-2 focus:ring-purple-100
                                   transition"
                        >

                    </div>


                    <!-- Password -->
                    <div>

                        <label
                            for="password"
                            class="block text-[11px] text-gray-500 mb-1"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password"
                                placeholder="Create your password"
                                class="w-full h-10 px-3 pr-10 text-xs
                                       border border-gray-200 rounded-md
                                       outline-none
                                       focus:border-purple-500
                                       focus:ring-2 focus:ring-purple-100
                                       transition"
                            >

                            <button
                                type="button"
                                class="absolute right-3 top-1/2
                                       -translate-y-1/2
                                       text-gray-400 hover:text-purple-600"
                            >
                                <i id="eye" class="fa-regular fa-eye text-xs"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Create Button -->
                    <button
                        type="submit"
                        class="w-full h-10 mt-2
                               bg-gradient-to-r
                               from-purple-600 to-indigo-600
                               hover:from-purple-700 hover:to-indigo-700
                               text-white text-xs font-semibold
                               rounded-full
                               shadow-md shadow-purple-200
                               transition duration-200"
                    >
                        Create an account
                    </button>

                </form>


                <!-- Login -->
                <p class="text-center text-[11px] text-gray-500 mt-4">

                    Already have an account?

                    <a
                        href="#"
                        class="text-purple-600 font-semibold hover:underline"
                    >
                        Login
                    </a>

                </p>


                <!-- Social Icons -->
                <div class="flex justify-center gap-4 mt-4">

                    <a
                        href="#"
                        class="w-7 h-7 rounded-full bg-gray-100
                               flex items-center justify-center
                               text-gray-500 text-xs
                               hover:bg-purple-100 hover:text-purple-600
                               transition"
                    >
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a
                        href="#"
                        class="w-7 h-7 rounded-full bg-gray-100
                               flex items-center justify-center
                               text-gray-500 text-xs
                               hover:bg-purple-100 hover:text-purple-600
                               transition"
                    >
                        <i class="fa-brands fa-twitter"></i>
                    </a>

                    <a
                        href="#"
                        class="w-7 h-7 rounded-full bg-gray-100
                               flex items-center justify-center
                               text-gray-500 text-xs
                               hover:bg-purple-100 hover:text-purple-600
                               transition"
                    >
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a
                        href="#"
                        class="w-7 h-7 rounded-full bg-gray-100
                               flex items-center justify-center
                               text-gray-500 text-xs
                               hover:bg-purple-100 hover:text-purple-600
                               transition"
                    >
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>

            </div>

        </div>

    </div>


    

</body>
</html>
